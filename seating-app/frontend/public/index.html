<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1117" />
    <title>Find Your Seat</title>
    <style>
      :root {
        --bg: #0f1117;
        --surface: #1a1d27;
        --surface-raised: #232733;
        --border: #2e3444;
        --text: #f0f2f7;
        --text-muted: #9aa3b5;
        --accent: #6c9eff;
        --accent-dim: #4a7ad4;
        --danger: #f07178;
        --radius: 14px;
        --tap: 48px;
        --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        font-family: var(--font);
        font-size: 17px;
        line-height: 1.45;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      .page {
        max-width: 560px;
        margin: 0 auto;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: env(safe-area-inset-top) 1rem env(safe-area-inset-bottom);
      }

      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.25rem 0 1rem;
      }

      .brand h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .brand p {
        margin: 0.35rem 0 0;
        font-size: 0.95rem;
        color: var(--text-muted);
      }

      .admin-link {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: var(--tap);
        min-width: var(--tap);
        padding: 0 0.85rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--text-muted);
        text-decoration: none;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface);
        transition: color 0.15s, border-color 0.15s, background 0.15s;
      }

      .admin-link:hover,
      .admin-link:focus-visible {
        color: var(--text);
        border-color: var(--accent-dim);
        background: var(--surface-raised);
        outline: none;
      }

      .search-wrap {
        position: sticky;
        top: 0;
        z-index: 10;
        padding-bottom: 0.75rem;
        background: linear-gradient(var(--bg) 70%, transparent);
      }

      .search-field {
        position: relative;
        display: flex;
        align-items: center;
      }

      .search-icon {
        position: absolute;
        left: 1.1rem;
        width: 1.25rem;
        height: 1.25rem;
        color: var(--text-muted);
        pointer-events: none;
      }

      #search-input {
        width: 100%;
        min-height: 56px;
        padding: 0.85rem 3rem 0.85rem 3rem;
        font: inherit;
        font-size: 1.125rem;
        color: var(--text);
        background: var(--surface);
        border: 2px solid var(--border);
        border-radius: var(--radius);
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
        -webkit-appearance: none;
        appearance: none;
      }

      #search-input::placeholder {
        color: var(--text-muted);
      }

      #search-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(108, 158, 255, 0.2);
      }

      .clear-btn {
        position: absolute;
        right: 0.5rem;
        display: none;
        align-items: center;
        justify-content: center;
        width: var(--tap);
        height: var(--tap);
        padding: 0;
        border: none;
        border-radius: 10px;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        transition: color 0.15s, background 0.15s;
      }

      .clear-btn.visible {
        display: flex;
      }

      .clear-btn:hover,
      .clear-btn:focus-visible {
        color: var(--text);
        background: var(--surface-raised);
        outline: none;
      }

      main {
        flex: 1;
        padding-bottom: 1.5rem;
      }

      .state {
        padding: 2.5rem 1rem;
        text-align: center;
        color: var(--text-muted);
      }

      .state-icon {
        font-size: 2.5rem;
        margin-bottom: 0.75rem;
        opacity: 0.7;
      }

      .state h2 {
        margin: 0 0 0.5rem;
        font-size: 1.15rem;
        font-weight: 600;
        color: var(--text);
      }

      .state p {
        margin: 0;
        font-size: 1rem;
        max-width: 280px;
        margin-inline: auto;
      }

      .results {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.1rem 1.15rem;
      }

      .card-name {
        margin: 0;
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        word-break: break-word;
      }

      .card-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.25rem;
        margin-top: 0.65rem;
      }

      .meta-item {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }

      .meta-label {
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
      }

      .meta-value {
        font-size: 1.05rem;
        font-weight: 500;
        color: var(--accent);
      }

      .meta-value.muted {
        color: var(--text-muted);
        font-weight: 400;
        font-style: italic;
      }

      .loading-dots::after {
        content: "";
        animation: dots 1.2s steps(4, end) infinite;
      }

      @keyframes dots {
        0% { content: ""; }
        25% { content: "."; }
        50% { content: ".."; }
        75% { content: "..."; }
      }

      .error-banner {
        margin-top: 0.5rem;
        padding: 0.85rem 1rem;
        font-size: 0.95rem;
        color: var(--danger);
        background: rgba(240, 113, 120, 0.1);
        border: 1px solid rgba(240, 113, 120, 0.25);
        border-radius: var(--radius);
        display: none;
      }

      .error-banner.visible {
        display: block;
      }

      @media (min-width: 480px) {
        .page {
          padding-left: 1.5rem;
          padding-right: 1.5rem;
        }

        .brand h1 {
          font-size: 1.65rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div class="brand">
          <h1>Find Your Seat</h1>
          <p>Search by guest name</p>
        </div>
        <a class="admin-link" href="/admin.html">Admin</a>
      </header>

      <div class="search-wrap">
        <div class="search-field">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3-3" stroke-linecap="round" />
          </svg>
          <input
            id="search-input"
            type="search"
            inputmode="search"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="Type a name…"
            aria-label="Search guests by name"
            aria-controls="results-panel"
            aria-describedby="status-text"
          />
          <button
            type="button"
            class="clear-btn"
            id="clear-btn"
            aria-label="Clear search"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <div class="error-banner" id="error-banner" role="alert"></div>
      </div>

      <main id="results-panel">
        <p id="status-text" class="visually-hidden" aria-live="polite"></p>
        <div id="content"></div>
      </main>
    </div>

    <style>
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>

    <script>
      const API_SEARCH = "/api/guests/search";
      const DEBOUNCE_MS = 280;

      const input = document.getElementById("search-input");
      const clearBtn = document.getElementById("clear-btn");
      const content = document.getElementById("content");
      const statusText = document.getElementById("status-text");
      const errorBanner = document.getElementById("error-banner");

      let debounceTimer = null;
      let activeController = null;
      let requestId = 0;

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function formatSeat(seatNumber) {
        if (seatNumber === null || seatNumber === undefined || seatNumber === "") {
          return { text: "—", muted: true };
        }
        return { text: String(seatNumber), muted: false };
      }

      function renderEmpty() {
        content.innerHTML = `
          <div class="state" id="state-empty">
            <div class="state-icon" aria-hidden="true">🔍</div>
            <h2>Who are you looking for?</h2>
            <p>Start typing a name to see table and seat details.</p>
          </div>
        `;
        statusText.textContent = "Enter a name to search.";
        hideError();
      }

      function renderLoading() {
        content.innerHTML = `
          <div class="state" id="state-loading">
            <p class="loading-dots">Searching</p>
          </div>
        `;
        statusText.textContent = "Searching…";
      }

      function renderNoResults(query) {
        content.innerHTML = `
          <div class="state" id="state-none">
            <div class="state-icon" aria-hidden="true">😕</div>
            <h2>No results</h2>
            <p>No guest found matching “${escapeHtml(query)}”. Check spelling or try another name.</p>
          </div>
        `;
        statusText.textContent = `No results for ${query}.`;
        hideError();
      }

      function renderResults(guests) {
        const items = guests
          .map((guest) => {
            const seat = formatSeat(guest.seatNumber);
            return `
              <li class="card">
                <p class="card-name">${escapeHtml(guest.fullName)}</p>
                <div class="card-meta">
                  <div class="meta-item">
                    <span class="meta-label">Table</span>
                    <span class="meta-value">${escapeHtml(guest.tableName)}</span>
                  </div>
                  <div class="meta-item">
                    <span class="meta-label">Seat</span>
                    <span class="meta-value${seat.muted ? " muted" : ""}">${escapeHtml(seat.text)}</span>
                  </div>
                </div>
              </li>
            `;
          })
          .join("");

        content.innerHTML = `<ul class="results" role="list">${items}</ul>`;
        const count = guests.length;
        statusText.textContent =
          count === 1 ? "1 result found." : `${count} results found.`;
        hideError();
      }

      function showError(message) {
        errorBanner.textContent = message;
        errorBanner.classList.add("visible");
      }

      function hideError() {
        errorBanner.textContent = "";
        errorBanner.classList.remove("visible");
      }

      function updateClearButton() {
        clearBtn.classList.toggle("visible", input.value.length > 0);
      }

      async function runSearch(query) {
        const trimmed = query.trim();

        if (!trimmed) {
          if (activeController) activeController.abort();
          renderEmpty();
          updateClearButton();
          return;
        }

        renderLoading();
        updateClearButton();

        if (activeController) activeController.abort();
        activeController = new AbortController();
        const currentId = ++requestId;

        try {
          const url = `${API_SEARCH}?query=${encodeURIComponent(trimmed)}`;
          const res = await fetch(url, { signal: activeController.signal });

          if (!res.ok) {
            throw new Error(`Search failed (${res.status})`);
          }

          const guests = await res.json();

          if (currentId !== requestId) return;

          if (!Array.isArray(guests) || guests.length === 0) {
            renderNoResults(trimmed);
          } else {
            renderResults(guests);
          }
        } catch (err) {
          if (err.name === "AbortError") return;
          if (currentId !== requestId) return;

          content.innerHTML = `
            <div class="state" id="state-error">
              <div class="state-icon" aria-hidden="true">⚠️</div>
              <h2>Search unavailable</h2>
              <p>Could not reach the server. Check your Wi‑Fi connection and try again.</p>
            </div>
          `;
          statusText.textContent = "Search failed.";
          showError(err.message || "Network error");
        }
      }

      function scheduleSearch() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => runSearch(input.value), DEBOUNCE_MS);
      }

      input.addEventListener("input", () => {
        updateClearButton();
        scheduleSearch();
      });

      clearBtn.addEventListener("click", () => {
        input.value = "";
        input.focus();
        updateClearButton();
        if (activeController) activeController.abort();
        renderEmpty();
      });

      input.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          input.value = "";
          updateClearButton();
          if (activeController) activeController.abort();
          renderEmpty();
        }
      });

      renderEmpty();
      updateClearButton();
      input.focus();
    </script>
  </body>
</html>
